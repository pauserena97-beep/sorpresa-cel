<title>Sorpresa Felicidades</title>
<style>
  :root {
    --bg: #0B0F1A;
    --bg-2: #10182B;
    --gold: #FFD166;
    --coral: #F78C6B;
    --pink: #EF476F;
    --teal: #4CC9F0;
    --text: #F4F1E8;
  }
  body {
    background: var(--bg);
    margin: 0;
    min-height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  html, body { height: 100%; }
  #fw {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    display: block;
  }
  .stage {
    position: relative;
    z-index: 1;
    padding: 20px;
    box-sizing: border-box;
    display: flex;
    justify-content: center;
  }
  .stage img {
    max-width: min(92vw, 420px);
    max-height: 82vh;
    width: auto;
    height: auto;
    border-radius: 20px;
    box-shadow: 0 24px 70px rgba(0,0,0,0.65), 0 0 0 1px rgba(255,255,255,0.06);
    display: block;
  }
  @media (prefers-reduced-motion: reduce) {
    #fw { display: none; }
  }
</style>

<script>
(function () {
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) return;

  var canvas = document.getElementById('fw');
  var ctx = canvas.getContext('2d');
  var particles = [];
  var lastBurst = 0;

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  var colors = ['#FFD166', '#EF476F', '#06D6A0', '#4CC9F0', '#FFFFFF', '#F78C6B'];

  function spawnBurst(x, y) {
    var count = 46 + Math.floor(Math.random() * 18);
    var color = colors[Math.floor(Math.random() * colors.length)];
    for (var i = 0; i < count; i++) {
      var angle = (Math.PI * 2 * i) / count + Math.random() * 0.2;
      var speed = 2 + Math.random() * 3.2;
      particles.push({
        x: x, y: y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        alpha: 1,
        color: color,
        size: 1.6 + Math.random() * 1.8
      });
    }
  }

  function loop(t) {
    var w = canvas.width, h = canvas.height;
    ctx.fillStyle = 'rgba(11,15,26,0.22)';
    ctx.fillRect(0, 0, w, h);

    if (t - lastBurst > 850) {
      lastBurst = t;
      var x = w * (0.12 + Math.random() * 0.76);
      var y = h * (0.1 + Math.random() * 0.3);
      spawnBurst(x, y);
    }

    particles.forEach(function (p) {
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.035;
      p.alpha -= 0.011;
    });
    particles = particles.filter(function (p) { return p.alpha > 0; });
    particles.forEach(function (p) {
      ctx.globalAlpha = Math.max(p.alpha, 0);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.globalAlpha = 1;

    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
